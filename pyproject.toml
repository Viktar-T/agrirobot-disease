# Piece 4 (model service v0) development environment; run from the repository root.
# H8 §6 / docs/piece4-work-plan.md W1 "Environment". Pieces 2 (ROS 2) and 3 build their
# own environments; this file is the only Python environment on the Windows dev box.
[project]
name = "agrirobot-disease"
version = "0.0.1"
description = "AgriRobot bean disease detection - Demo 1 (piece 4: model service v0)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }

dependencies = [
    # backbones and feature extraction (S4.2)
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5.17,<6",  # model_service/DECISIONS.md 12 (2026-09-18)
    # arrays, tables, cache/manifest IO (S4.1, S4.2, S4.5)
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pillow>=11",
    # heads, kNN / Mahalanobis scores, calibration (S4.3, S4.4)
    "scikit-learn>=1.5",
    # configs (configs/backbones/*.yaml, configs/class_map_v1.yaml) and .env
    "pyyaml>=6",
    "python-dotenv>=1.0",
    # experiment tracking and data versioning (piece 3 hands these over in W2)
    "mlflow>=2.17",
    "dvc>=3.55",
    # the service (S4.6) and interface v0 validation (piece 1)
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_service/src/ms"]

# --- uv -------------------------------------------------------------------
# torch/torchvision come from the PyTorch cu128 index: the dev GPU is an RTX 5060
# Laptop (Blackwell, compute capability 12.0), which the default PyPI CPU/cu126
# wheels do not cover. See model_service/DECISIONS.md (2026-09-17).
[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

# --- tooling --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["model_service/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["model_service/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
